# Build and publish the Android APK entirely on GitHub. No Expo account and no local machine needed.
#
# Two ways to release:
#   • GitHub → Actions → "Release APK" → Run workflow → enter a version like 1.2.0
#     (bumps app.json, commits, tags, builds, publishes). Tick "prerelease" for a test build that
#     phones are not offered until you mark it as the latest release.
#   • or push a tag yourself: git tag v1.2.0 && git push --tags
#
# The app's Settings → "Check for updates" reads the latest release and installs its APK.
#
# Optional signing secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Gradle always signs with the standard React Native debug key. With the secrets, step "Sign APK with key
# rotation" (scripts/sign-apk-rotation.sh) re-signs it with APK Signature Scheme v3 key rotation: v2 stays the
# debug key (Android 7-8), v3 is your key with a lineage debug key -> your key (Android 9+), so installed
# apps update in place without an uninstall. Prove the commands first with the "Signing self-test" workflow.
name: Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version (e.g. 1.2.0)'
        required: true
      notes:
        description: "What's new (shown in the app's update screen)"
        required: false
      prerelease:
        description: 'Test build: publish as a pre-release. Phones are not offered it until you mark it "latest".'
        type: boolean
        default: false
  push:
    tags: ['v*']
    # Changing the version in app.json on main also releases (no tag push needed)
    branches: [main]
    paths: ['app.json']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.handover.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Tests and typecheck
        run: npm test && npx tsc --noEmit

      - name: Bump version (manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          VERSION="${VERSION#v}"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::Version must look like 1.2.0"; exit 1; }
          node -e '
            const fs = require("fs");
            const j = JSON.parse(fs.readFileSync("app.json"));
            const cur = j.expo.version.split(".").map(Number), next = process.env.VERSION.split(".").map(Number);
            const newer = next[0] - cur[0] || next[1] - cur[1] || next[2] - cur[2];
            if (newer <= 0) { console.error(`::error::${process.env.VERSION} is not newer than ${j.expo.version}`); process.exit(1); }
            j.expo.version = process.env.VERSION;
            j.expo.android.versionCode = (j.expo.android.versionCode || 1) + 1;
            fs.writeFileSync("app.json", JSON.stringify(j, null, 2) + "\n");
          ' VERSION="$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD "v$VERSION"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Use pushed tag
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          APP=$(node -p "require('./app.json').expo.version")
          [ "v$APP" = "$GITHUB_REF_NAME" ] || { echo "::error::app.json version $APP does not match tag $GITHUB_REF_NAME"; exit 1; }
          echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      - name: Version change on main
        if: github.event_name == 'push' && github.ref_type == 'branch'
        run: |
          APP=$(node -p "require('./app.json').expo.version")
          if git rev-parse -q --verify "refs/tags/v$APP" >/dev/null; then
            echo "::notice::v$APP is already released, nothing to do"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
          echo "TAG=v$APP" >> "$GITHUB_ENV"

      - name: Generate native Android project
        if: env.SKIP != '1'
        run: npx expo prebuild -p android --no-install --clean

      # The release key is NOT given to Gradle (STRIDE_KEYSTORE_FILE stays unset): Gradle signs with the debug key
      # and "Sign APK with key rotation" below adds the release key on top of it.
      - name: Prepare signing key
        if: env.SKIP != '1'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret, signing with the shared debug key"
            exit 0
          fi
          [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] || {
            echo "::error::ANDROID_KEYSTORE_BASE64 is set, but ANDROID_KEYSTORE_PASSWORD or ANDROID_KEY_ALIAS is missing"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode --ignore-garbage > "$RUNNER_TEMP/release.jks" 2>/dev/null && [ -s "$RUNNER_TEMP/release.jks" ] || {
            echo "::error::ANDROID_KEYSTORE_BASE64 is not a base64-encoded keystore"; exit 1; }
          echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "Signing with key rotation: debug key -> your release key"

      # The app and update.json carry the fingerprint of the key the APK is effectively signed with (with key
      # rotation: the release key, which Android 9+ checks) and, with rotation, the lineage [debug key, release
      # key]. An app whose own key is in the lineage updates in place; only a key change WITHOUT a lineage makes
      # phones guide the user through a one-time reinstall instead of failing in the Android installer.
      - name: Signing fingerprint
        if: env.SKIP != '1'
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          fp() { keytool -list -v -keystore "$1" -alias "$2" -storepass:env "$3" | awk '/SHA256:/{print $2; exit}'; }
          is_fp() { echo "$1" | grep -Eq '^([0-9A-F]{2}:){31}[0-9A-F]{2}$'; }
          DEBUG_KEYSTORE_PASSWORD=android; export DEBUG_KEYSTORE_PASSWORD # the public debug key's password
          OLD=$(fp android/app/debug.keystore androiddebugkey DEBUG_KEYSTORE_PASSWORD || true)
          is_fp "$OLD" || { echo "::error::Could not read the debug key's fingerprint (android/app/debug.keystore)"; exit 1; }
          if [ -n "${RELEASE_KEYSTORE:-}" ]; then
            NEW=$(fp "$RELEASE_KEYSTORE" "$RELEASE_KEY_ALIAS" RELEASE_KEYSTORE_PASSWORD || true)
            is_fp "$NEW" || { echo "::error::Could not read the release key (check ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS)"; exit 1; }
            [ "$NEW" != "$OLD" ] || { echo "::error::The ANDROID_KEYSTORE_* secrets hold the debug key"; exit 1; }
            FP=$NEW; LINEAGE="$OLD,$NEW"
          else
            FP=$OLD; LINEAGE=
          fi
          echo "SIGNER=$FP" >> "$GITHUB_ENV"
          echo "LINEAGE=$LINEAGE" >> "$GITHUB_ENV"
          echo "Signing certificate SHA-256: $FP"
          [ -z "$LINEAGE" ] || echo "Key rotation lineage: $LINEAGE"
          # embedded in the app's config (read at build time by expo-constants); not committed
          SIGNER="$FP" node -e '
            const fs = require("fs"); const j = JSON.parse(fs.readFileSync("app.json"));
            j.expo.extra = { ...(j.expo.extra || {}), signer: process.env.SIGNER };
            fs.writeFileSync("app.json", JSON.stringify(j, null, 2) + "\n");
          '

      - name: Build APK
        if: env.SKIP != '1'
        working-directory: android
        env:
          # always the debug key here (see "Prepare signing key"); never hand the release key to Gradle
          STRIDE_KEYSTORE_FILE: ''
          # one ABI pair keeps the APK small; covers practically every phone from the last 8 years
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a,armeabi-v7a
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        if: env.SKIP != '1' && !env.RELEASE_KEYSTORE
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/tbdi-fittrack-${TAG}.apk"
          ls -lh dist

      # v2 signature: debug key (Android 7-8 keep updating as before). v3: release key + lineage debug -> release
      # key from Android 9 (--rotation-min-sdk-version 28, no rollback), so those phones move to the release key
      # in place. The script fails the run unless apksigner verify shows exactly that and the signers match
      # SIGNER/LINEAGE. Passwords reach keytool/apksigner only as environment variables.
      - name: Sign APK with key rotation
        if: env.SKIP != '1' && env.RELEASE_KEYSTORE
        env:
          NEW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NEW_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NEW_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p dist
          OLD_KEYSTORE=android/app/debug.keystore NEW_KEYSTORE="$RELEASE_KEYSTORE" \
          EXPECT_SIGNER="$SIGNER" EXPECT_LINEAGE="$LINEAGE" LINEAGE_FILE="$RUNNER_TEMP/rotation.lineage" \
            bash scripts/sign-apk-rotation.sh android/app/build/outputs/apk/release/app-release.apk "dist/tbdi-fittrack-${TAG}.apk"
          ls -lh dist

      # The app reads releases/latest/download/update.json, which GitHub serves from its download CDN
      # without the REST API's 60-requests-per-hour-per-IP limit (many phones share one office IP).
      - name: Write update manifest
        if: env.SKIP != '1'
        env:
          NOTES: ${{ inputs.notes }}
          REPO: ${{ github.repository }}
        run: |
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const { TAG, REPO, NOTES, SIGNER, LINEAGE } = process.env;
            const apk = `tbdi-fittrack-${TAG}.apk`, buf = fs.readFileSync(`dist/${apk}`);
            const app = JSON.parse(fs.readFileSync("app.json", "utf8")).expo;
            const base = `https://github.com/${REPO}/releases`;
            fs.writeFileSync("dist/update.json", JSON.stringify({
              version: app.version, versionCode: app.android.versionCode, apk,
              url: `${base}/download/${TAG}/${apk}`, page: `${base}/tag/${TAG}`,
              size: buf.length, sha256: crypto.createHash("sha256").update(buf).digest("hex"), signer: SIGNER,
              // key rotation: every key the signer descends from, oldest first (apps signed with one update in place)
              ...(LINEAGE ? { lineage: LINEAGE.split(",") } : {}),
              notes: NOTES || "", publishedAt: new Date().toISOString(),
            }, null, 2) + "\n");
          '
          cat dist/update.json

      - name: Publish GitHub release
        if: env.SKIP != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: TBDI FitTrack ${{ env.TAG }}
          body: ${{ inputs.notes }}
          # pre-releases never become "latest", so the in-app updater (releases/latest) ignores them
          prerelease: ${{ inputs.prerelease == true }}
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/update.json

      - name: Hand the tag to the iPhone build
        id: handover
        if: env.SKIP != '1'
        run: echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Remove the release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/rotation.lineage"

  # The iPhone .ipa (AltStore) is built on macOS after the APK is out, so an iOS problem can never hold
  # up the Android release.
  ios:
    needs: release
    if: needs.release.outputs.tag != ''
    uses: ./.github/workflows/ios.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
