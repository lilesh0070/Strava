# Push a tag like v1.2.0 → EAS builds the APK → it is attached to a GitHub Release.
# The app's "Check for updates" reads the latest release and offers that APK.
# One-time setup: add an EXPO_TOKEN secret (expo.dev → Account settings → Access tokens).
name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check tag matches app.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APP=$(node -p "require('./app.json').expo.version")
          TAG=${GITHUB_REF_NAME#v}
          [ "$APP" = "$TAG" ] || { echo "app.json version $APP does not match tag $TAG"; exit 1; }

      - run: npm test && npx tsc --noEmit

      - name: Build APK on EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli@latest build -p android --profile preview --non-interactive --wait --json > build.json
          URL=$(node -p "require('./build.json')[0].artifacts.buildUrl")
          curl -fL "$URL" -o "stride-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: stride-*.apk
          generate_release_notes: true
